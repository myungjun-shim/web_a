<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jQuery 웹 계산기 (수식 누적형)</title>
  <!-- jQuery CDN 로드 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f0f2f5;
    }

    .calculator {
      width: 320px;
      background-color: #1c1c1e;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    }

    .display {
      width: 100%;
      height: 110px;
      margin-bottom: 16px;
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      background-color: #2c2c2e;
      border-radius: 14px;
      overflow: hidden;
    }

    .sub-display {
      color: #a1a1a6;
      font-size: 16px;
      min-height: 22px;
      margin-bottom: 6px;
      width: 100%;
      text-align: right;
      white-space: nowrap;
      overflow-x: auto;
    }

    .main-display {
      color: #ffffff;
      font-size: 38px;
      font-weight: 500;
      width: 100%;
      text-align: right;
      white-space: nowrap;
      overflow-x: auto;
    }

    .sub-display::-webkit-scrollbar,
    .main-display::-webkit-scrollbar {
      display: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 62px;
      border: none;
      border-radius: 16px;
      font-size: 22px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.15s, transform 0.05s;
    }

    button:hover {
      filter: brightness(1.15);
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-num {
      background-color: #3a3a3c;
      color: #ffffff;
    }

    .btn-op {
      background-color: #ff9f0a;
      color: #ffffff;
      font-size: 26px;
    }

    .btn-op.active {
      background-color: #ffffff;
      color: #ff9f0a;
    }

    .btn-ac {
      background-color: #a5a5a5;
      color: #000000;
      font-weight: 600;
      grid-column: span 3;
    }

    .btn-zero {
      grid-column: span 3;
    }

    .btn-eq {
      background-color: #30d158;
      color: #ffffff;
      font-size: 26px;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="sub-display" id="subDisplay"></div>
      <div class="main-display" id="mainDisplay">0</div>
    </div>

    <div class="buttons">
      <button class="btn-ac" id="btnAc">AC</button>
      <button class="btn-op" data-op="/">÷</button>

      <button class="btn-num" data-num="7">7</button>
      <button class="btn-num" data-num="8">8</button>
      <button class="btn-num" data-num="9">9</button>
      <button class="btn-op" data-op="*">×</button>

      <button class="btn-num" data-num="4">4</button>
      <button class="btn-num" data-num="5">5</button>
      <button class="btn-num" data-num="6">6</button>
      <button class="btn-op" data-op="-">−</button>

      <button class="btn-num" data-num="1">1</button>
      <button class="btn-num" data-num="2">2</button>
      <button class="btn-num" data-num="3">3</button>
      <button class="btn-op" data-op="+">+</button>

      <button class="btn-num btn-zero" data-num="0">0</button>
      <button class="btn-eq" id="btnEq">=</button>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      let currentInput = '0';       // 현재 입력 중인 숫자
      let expressionTokens = [];    // 누적되는 수식 배열 (예: ['10', '+', '2', '*', '5'])
      let isCalculated = false;     // '='을 눌러 계산이 막 완료된 상태인지 여부
      let waitingForOperand = false; // 연산자를 누른 직후 새 숫자를 기다리는 상태

      const $mainDisplay = $('#mainDisplay');
      const $subDisplay = $('#subDisplay');
      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };

      // 수식 배열을 보기 좋은 문자열로 변환하는 함수
      function formatExpression(tokens) {
        return tokens.map(token => opSymbols[token] || token).join(' ');
      }

      // 화면 업데이트 함수
      function updateDisplay() {
        $mainDisplay.text(currentInput);
        $subDisplay.text(formatExpression(expressionTokens));
        // 수식이 길어지면 가장 오른쪽(최신 입력)으로 자동 스크롤
        $subDisplay.scrollLeft($subDisplay[0].scrollWidth);
      }

      // AC (초기화) 함수
      function clearAll() {
        currentInput = '0';
        expressionTokens = [];
        isCalculated = false;
        waitingForOperand = false;
        $('.btn-op').removeClass('active');
        updateDisplay();
      }

      // 누적된 수식 배열을 사칙연산 우선순위(*, / 먼저, +, - 나중)에 따라 계산하는 함수
      function evaluateTokens(tokens) {
        // 1단계: 곱셈(*), 나눗셈(/) 먼저 처리
        let firstPass = [];
        let i = 0;
        while (i < tokens.length) {
          const token = tokens[i];
          if (token === '*' || token === '/') {
            const prevNum = parseFloat(firstPass.pop());
            const nextNum = parseFloat(tokens[i + 1]);
            if (token === '/' && nextNum === 0) return 'Error';
            const res = (token === '*') ? prevNum * nextNum : prevNum / nextNum;
            firstPass.push(res);
            i += 2;
          } else {
            firstPass.push(token);
            i += 1;
          }
        }

        // 2단계: 덧셈(+), 뺄셈(-) 순차 처리
        let result = parseFloat(firstPass[0]);
        for (let j = 1; j < firstPass.length; j += 2) {
          const op = firstPass[j];
          const nextNum = parseFloat(firstPass[j + 1]);
          if (op === '+') result += nextNum;
          if (op === '-') result -= nextNum;
        }

        // 부동소수점 오차 보정
        return Math.round(result * 1000000000) / 1000000000;
      }

      // 1. 숫자 버튼(0~9) 클릭 이벤트
      $('.btn-num').on('click', function () {
        const num = $(this).data('num').toString();

        // '='을 누른 직후 연산자 없이 숫자를 누르면 자동 AC(초기화) 실행
        if (isCalculated) {
          clearAll();
        }

        if (currentInput === 'Error') {
          clearAll();
        }

        if (waitingForOperand) {
          currentInput = num;
          waitingForOperand = false;
        } else {
          currentInput = (currentInput === '0') ? num : currentInput + num;
        }

        $('.btn-op').removeClass('active');
        updateDisplay();
      });

      // 2. 연산자 버튼(+, -, *, /) 클릭 이벤트
      $('.btn-op').on('click', function () {
        if (currentInput === 'Error') return;

        const selectedOp = $(this).data('op');

        if (isCalculated) {
          // '=' 직후 연산자를 누르면 결과값을 첫 항으로 두고 수식 이어가기
          expressionTokens = [currentInput, selectedOp];
          isCalculated = false;
          waitingForOperand = true;
        } else if (waitingForOperand) {
          // 숫자를 입력하지 않고 연산자만 연달아 눌렀을 때는 마지막 연산자만 교체
          expressionTokens[expressionTokens.length - 1] = selectedOp;
        } else {
          // 현재 숫자와 선택한 연산자를 계산하지 않고 과정 배열에 그대로 추가
          expressionTokens.push(currentInput);
          expressionTokens.push(selectedOp);
          waitingForOperand = true;
        }

        $('.btn-op').removeClass('active');
        $(this).addClass('active');
        updateDisplay();
      });

      // 3. '=' 버튼 클릭 이벤트 (오직 이 시점에만 실제 연산 수행)
      $('#btnEq').on('click', function () {
        if (expressionTokens.length === 0 || isCalculated || currentInput === 'Error') return;

        // 마지막에 입력 중이던 숫자를 수식 배열에 포함
        const fullExpression = [...expressionTokens, currentInput];
        const result = evaluateTokens(fullExpression);

        // 상단 보조 화면에 완성된 전체 수식과 '=' 표시
        $subDisplay.text(`${formatExpression(fullExpression)} =`);
        $subDisplay.scrollLeft($subDisplay[0].scrollWidth);

        currentInput = result.toString();
        $mainDisplay.text(currentInput);

        // 상태 업데이트
        expressionTokens = [];
        isCalculated = true;
        waitingForOperand = false;
        $('.btn-op').removeClass('active');
      });

      // 4. 'AC' 버튼 클릭 이벤트
      $('#btnAc').on('click', function () {
        clearAll();
      });
    });
  </script>
</body>
</html>
