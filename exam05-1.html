<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>표</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gasoek+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&display=swap" rel="stylesheet">
    <style>
        table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 300px;
        }
        th, td {
            text-align: center;
            vertical-align: middle;
            height: 50px;
            font-family: "Nanum Gothic", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        .T1 {
            font-family: "Bagel Fat One", system-ui;
            font-weight: 400;
            font-style: normal;
        }
        .T2 {
            font-family: "Gasoek One", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        .T3 {
            font-family: "Nanum Gothic", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
    </style>
</head>
<body>
    <h1 class="T2">시간표 만들기</h1>
    <table border="1">
        <thead>
            <tr>
                <th>월</th>
                <th>화</th>
                <th>수</th>
                <th>목</th>
                <th>금</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td></td>
                <td rowspan="3" style="background-color: aqua;">웹<br>프로<br>그래밍</td>
                <td></td>
                <td rowspan="3" style="background-color: greenyellow;">데이터<br>베이스<br>설계</td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td style="background-color: sandybrown;">채플</td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td rowspan="2" style="background-color: salmon;">역사와<br>문화</td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td rowspan="3"style="background-color: yellow">기계<br>학습</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td rowspan="3" style="background-color: magenta;">객체<br>지향<br>프로<br>그래밍</td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td rowspan="3" style="background-color: orchid;">국제<br>사이버<br>법의<br>이해</td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td style="background-color: ivory;">인설진</td>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
